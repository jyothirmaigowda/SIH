version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sims_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sims_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sims_dev_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-sims_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sims_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sims_user} -d ${POSTGRES_DB:-sims_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sims_pgadmin
    restart: unless-stopped
    profiles: ["pgadmin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sims.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_only
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sims_postgres_data:
    driver: local
